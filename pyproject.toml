[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "LOVE-commander"
description = "LSST Operators Visualization Environment (LOVE) service to send SAL commands from http endpoints using salobj."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://love-commander.lsst.io", source_code = "https://github.com/lsst-ts/LOVE-commander" }
dynamic = [ "version" ]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
